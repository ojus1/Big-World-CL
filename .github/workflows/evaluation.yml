name: Offline evaluation tests

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evaluation:
    # Ubuntu 22.04 permits the unprivileged user namespaces exercised by the
    # real bubblewrap boundary tests without changing host security settings.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install bubblewrap for filesystem boundary tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap

      - name: Fetch reviewed upstream SkillOpt
        run: python scripts/install_skillopt.py

      - name: Fetch pinned Hermes source for pure tool-envelope parity
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: NousResearch/hermes-agent
          ref: 2c8a2b65aa148ceb178d2251c54a523af12092c9
          path: .cache/Hermes-readback-source
          persist-credentials: false

      - name: Test native readback warning compatibility and tamper rejection
        env:
          BIGWORLD_TEST_HERMES_SOURCE: ${{ github.workspace }}/.cache/Hermes-readback-source
        run: python -m unittest tests.test_hermes_readback_v2 -v

      - name: Run offline evaluation and existing lifespan tests
        # The suite uses standard-library fixtures and the actual pinned
        # SkillOpt code. No LLM credentials, personal agent profiles, Persona
        # downloads or native MiroFish/Hermes services are needed.
        run: python -m unittest discover -s lifespan/tests -v

      - name: Test independent artifact audit, corrected reporting and tamper detection
        run: python -m unittest discover -s tests -p 'test_evaluation_*.py' -v

      - name: Test V2 terminal learning-operation and legacy audit evidence
        run: python -m unittest tests.test_learning_audit_v2 -v

      - name: Test calibration selection, native orchestration and audit
        run: python -m unittest discover -s tests -p 'test_calibration_*.py' -v

      - name: Test bounded learning and frozen development transfer probes
        run: python -m unittest discover -s tests -p 'test_transfer_*.py' -v

      - name: Test population scale, campaign supervision and independent audit
        run: python -m unittest discover -s tests -p 'test_scale_*.py' -v

      - name: Test concurrent six-world follow-up supervision
        run: python -m unittest tests.test_run_scale_v2 -v

      - name: Test fixed Hermes transport preflight and independent evidence audit
        # Standard-library synthetic receipts and owned local process/socket
        # fixtures only; no Hermes install, provider key or native calls.
        run: python -m unittest tests.test_hermes_transport_preflight tests.test_hermes_preflight_audit -v

  actor-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      BIGWORLD_TEST_MIROFISH_SOURCE: ${{ github.workspace }}/.cache/MiroFish-actor-source
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out pinned MiroFish source for read-only transport fixtures
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: 666ghj/MiroFish
          ref: 39d849138ef254f6c737ab4c4705e5545dbe31d4
          path: .cache/MiroFish-actor-source
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install explicit offline test dependencies
        run: python -m pip install -r tests/requirements-actor-contract.txt

      - name: Test scoped actor contracts and actual patched transport methods
        # Fake actors + mocked HTTP only. The fixture reads pinned git source,
        # applies the tracked patch in a temporary directory and starts no native
        # server, OASIS environment or provider request. Missing source is fatal.
        run: python -m pytest tests/test_actor_output_contract.py -q
